{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | Advance Billing System</title>

    <link rel="stylesheet" href="{% static 'css/product_add.css' %}">
</head>

<body>

    <div class="product-page">

        <div class="product-card">

            <div class="page-header">
                <span class="eyebrow">PRODUCT MANAGEMENT</span>

                <h1>Add New Product</h1>

                <p>
                    Add product information to your billing inventory.
                </p>
            </div>

            {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">

                    <div class="field">
                        <label>Product Name</label>

                        <input
                            type="text"
                            name="name"
                            value="{{ name|default:'' }}"
                            placeholder="Enter product name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Category</label>

                        <input
                            type="text"
                            name="category"
                            value="{{ category|default:'' }}"
                            placeholder="e.g. Electronics"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Price</label>

                        <input
                            type="number"
                            name="price"
                            value="{{ price|default:'' }}"
                            min="0.01"
                            step="0.01"
                            placeholder="0.00"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Stock</label>

                        <input
                            type="number"
                            name="stock"
                            value="{{ stock|default:'' }}"
                            min="0"
                            placeholder="Enter stock quantity"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>GST Rate (%)</label>

                        <input
                            type="number"
                            name="gst_rate"
                            value="{{ gst_rate|default:'' }}"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="e.g. 18"
                            required
                        >
                    </div>

                    <div class="field full-width">
                        <label>Description</label>

                        <textarea
                            name="description"
                            rows="4"
                            placeholder="Enter product description"
                        >{{ description|default:'' }}</textarea>
                    </div>

                </div>

                <div class="form-actions">

                    <a href="{% url 'product_list' %}" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="submit-btn">
                        Add Product
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
